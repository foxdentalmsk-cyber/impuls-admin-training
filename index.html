<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест администраторов — МЦ «Импульс»</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f8;color:#123047;font:17px/1.5 system-ui,sans-serif}main{margin:clamp(12px,5vw,54px) auto;width:min(94%,680px);padding:clamp(16px,5vw,40px);background:white;border-radius:18px;box-shadow:0 8px 38px #163f551a}h1{font-size:clamp(23px,5vw,34px);line-height:1.18}h2{font-size:1.22rem;overflow-wrap:anywhere}label,select,input,button{font:inherit}select,input:not([type=radio]),button{width:100%;min-height:48px;border-radius:8px;padding:8px 12px;margin:5px 0}select,input:not([type=radio]){border:1px solid #66808c;background:#fff}button{background:#006858;color:white;border:0;font-weight:650}button:disabled{opacity:.55}fieldset{border:0;margin:0;padding:0}legend{font-weight:700}fieldset label{display:flex;align-items:center;gap:10px;padding:10px;margin:8px 0;border:1px solid #83a3ae;border-radius:8px;min-height:48px}#status{color:#8b2424}article{border-top:1px solid #aabec8;padding:8px 0}p{overflow-wrap:anywhere}
</style><main><h1>МЦ «Импульс» — тест администраторов</h1><p>20 вопросов. После подтверждения ответ изменить нельзя.</p><div id="status" role="alert"></div><div id="screen"></div></main>
<script>
'use strict';
const key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFycWlwdWR0bGZkdXpidmNmbG1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3Mzg4NzEsImV4cCI6MjExMDMxNDg3MX0.t-RBFFl0oFOfxX7hFcPVncqP7U6xJ09gkMWAFTPz_xI", url='https://arqipudtlfduzbvcflmr.supabase.co/functions/v1/impuls-quiz', screen=document.querySelector('#screen'), status=document.querySelector('#status');
const qa=location.pathname.endsWith('/training-preview.html'), storage='impuls-quiz-v2'+(qa?'-preview':'');
let token=sessionStorage.getItem(storage), busy=false;
const node=(tag,s,txt)=>{const e=document.createElement(tag);if(txt)e.textContent=txt;s.append(e);return e};
const button=(parent,word)=>node('button',parent,word);
async function call(action,data){
 const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',apikey:key,Authorization:'Bearer '+key},body:JSON.stringify({action,token,...data})});
 const x=await r.json();if(!r.ok)throw new Error(x.message||'Сервис временно недоступен.');return x;
}
async function run(b,action,data){
 if(busy)return;busy=true;b.disabled=true;status.textContent='';
 try{const x=await call(action,data);show(x);}
 catch(e){status.textContent=e.message==='Failed to fetch'?'Нет связи с сервером. Попробуйте ещё раз.':e.message;}
 finally{busy=false;b.disabled=false;}
}
function start(){
 screen.replaceChildren();
 const f=node('form',screen), l=node('label',f,'Участник');l.htmlFor='category';
 const select=node('select',f);select.id='category';select.required=true;
 for(const [v,t] of [['','Выберите участника'],['elvira','Эльвира'],['elena','Елена'],['other','Другие'],...(qa?[['qa','ТЕСТ QA — не зачёт']]:[])]){
  const o=node('option',select,t);o.value=v;
 }
 const row=node('div',f), label=node('label',row), input=node('input',row);label.htmlFor=input.id='participant-detail';input.maxLength=80;
 const change=()=>{const c=select.value;row.hidden=!c;input.required=!!c;input.type=c==='other'?'text':'password';input.value='';label.textContent=c==='other'?'Ваше имя':'Код приглашения';input.autocomplete='off';};select.onchange=change;change();
 const b=button(f,'Начать тест');
 f.onsubmit=e=>{e.preventDefault();const c=select.value,v=input.value.trim();if(!v){status.textContent='Заполните поле.';return;}
 token=token||Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');sessionStorage.setItem(storage,token);
 run(b,'start',c==='other'?{category:c,name:v}:{category:c,invite:v});};
}
function show(x){
 screen.replaceChildren();
 if(x.completed){
 const h=node('h2',screen,'Результат: '+x.score+'/20 · '+x.percent+'%');h.tabIndex=-1;h.focus();
 node('p',screen,'Идентификатор результата: '+x.id);
 if(x.notification!=='sent')node('p',screen,'Результат сохранён. Доставка уведомления пока не подтверждена.');
 node('h3',screen,'Разбор ответов');
 x.review.forEach((a,i)=>{const row=node('article',screen);node('strong',row,(i+1)+'. '+a.question);node('p',row,'Ваш ответ: '+a.answer+' · Правильный: '+a.correct);node('p',row,a.explanation)});
 return;
 }
 if(!x.position||!Array.isArray(x.options))throw Error('Сервер вернул неполный ответ.');
 const h=node('h2',screen,'Вопрос '+x.position+' из 20');h.tabIndex=-1;h.focus();
 const f=node('form',screen), group=node('fieldset',f);node('legend',group,x.question);
 for(const t of x.options){const l=node('label',group),i=node('input',l);i.type='radio';i.name='answer';i.value=t;i.required=true;node('span',l,t);}
 const b=button(f,'Подтвердить ответ');
 f.onsubmit=e=>{e.preventDefault();const option=f.querySelector('input:checked');if(option)run(b,'answer',{position:x.position,answer:option.value});};
}
start();
if(token){const b=button(screen,'Продолжить сохранённую попытку');b.onclick=()=>run(b,'resume',{});}
</script></html>
