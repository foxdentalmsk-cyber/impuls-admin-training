<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Импульс — тест по разметке звонков</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f3f6fa;color:#18243a;margin:0}main{max-width:760px;margin:auto;padding:22px 14px 60px}h1{font-size:26px}section{background:white;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 2px 10px #18243a0b}label{display:block;padding:9px 10px;margin:7px 0;border:1px solid #dce4ef;border-radius:9px;cursor:pointer}input{margin-right:8px}button{background:#286dff;color:white;border:0;padding:14px 22px;border-radius:10px;font-size:17px;cursor:pointer}small{color:#64748b}.feedback{margin-top:10px;padding:10px;border-radius:9px;background:#eff5ff}.good{background:#e7f7ee}.bad{background:#fff0ee}#result{font-size:20px;font-weight:700}</style></head><body><main><h1>МЦ «Импульс» — разметка звонков</h1><p>Обучающий тест для администраторов. Выберите один ответ в каждой ситуации, затем нажмите «Проверить». После проверки появятся правильные ответы и пояснения.</p><div id="questions"></div><button onclick="check()">Проверить ответы</button> <button style="background:#64748b" onclick="location.reload()">Пройти заново</button><section id="result" aria-live="polite"></section><small>Учебный материал. Пограничные случаи изменения существующей записи требуют отдельного согласования.</small></main><script>
const items=[
['Пациентка хочет сегодня сделать УЗИ по беременности. Услуга есть в прайсе, но мест нет, запись не оформлена.','Целевой','Пациентка обращается за услугой из прайса; отсутствие времени не делает звонок нецелевым.'],
['Пациент согласовал время приёма терапевта, администратор внёс запись в SQNS.','Запись','Запись действительно оформлена.'],
['Пациент хочет к врачу из клиники, но врач сегодня отсутствует. Другую дату пациент не выбрал.','Целевой','Отсутствие врача не меняет характер обращения за услугой клиники.'],
['Звонит рекламное агентство с нежелательным предложением продвижения.','Спам','Нежелательное рекламное предложение — спам.'],
['Пациент узнаёт цену УЗИ из прайса и обещает подумать.','Целевой','Запрос связан с услугой клиники, хотя записи нет.'],
['Человек ошибся номером: хотел позвонить в другую клинику.','Нецелевой','Это ошибочный звонок, не связанный с услугами клиники.'],
['Пациент спрашивает обследование, которого нет в прайсе клиники, и не интересуется другими услугами.','Нецелевой','По согласованному правилу целевые обращения относятся к услугам из прайса.'],
['Пациенту предложили время на анализ из прайса, но он обещал перезвонить. Запись в SQNS не создавалась.','Целевой','Предложенное время и намерение перезвонить не равны оформленной записи.'],
['Услуга есть в прайсе, но пациенту не подошла предложенная дата. Запись не состоялась.','Целевой','Отсутствие подходящей даты не делает обращение нецелевым.'],
['Звонок пока не появился в личном кабинете. Как поступить?','Зафиксировать 4 цифры и статус','Временно запишите последние четыре цифры номера и статус, чтобы разметить звонок после появления в кабинете.']
];const statuses=['Целевой','Запись','Нецелевой','Спам'];const wrap=document.getElementById('questions');items.forEach((x,i)=>{let choices=i===9?['Ждать и ничего не фиксировать','Зафиксировать 4 цифры и статус','Поставить статус наугад','Перезвонить всем пациентам']:statuses;let html=`<section id="q${i}"><b>${i+1}. ${x[0]}</b>`+choices.map(v=>`<label><input type="radio" name="a${i}" value="${v}">${v}</label>`).join('')+`<div class="feedback" hidden></div></section>`;wrap.insertAdjacentHTML('beforeend',html)});function check(){let count=0,answered=0;items.forEach((x,i)=>{let sec=document.getElementById('q'+i),v=sec.querySelector('input:checked')?.value,fb=sec.querySelector('.feedback');if(v)answered++;if(v===x[1])count++;fb.hidden=false;fb.className='feedback '+(v===x[1]?'good':'bad');fb.textContent=(v===x[1]?'Верно. ':'Правильный ответ: '+x[1]+'. ')+x[2]});document.getElementById('result').textContent=`Результат: ${count} из ${items.length}. ${answered<items.length?'Не все вопросы заполнены. ':''}${count>=9?'Тест пройден.':'Рекомендуется повторить правила и пройти тест ещё раз.'}`;document.getElementById('result').scrollIntoView({behavior:'smooth'})}</script></body></html>
